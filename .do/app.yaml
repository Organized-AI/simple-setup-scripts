name: simple-setup-scripts
services:
- name: hackathon-setup-landing
  type: static_site
  source_dir: /
  github:
    repo: Organized-AI/simple-setup-scripts
    branch: main
    deploy_on_push: true
  environment_slug: html
  index_document: index.html
  catchall_document: index.html
  routes:
  - path: /
  - path: /scripts
  cors:
    allow_origins:
    - "*"
    allow_methods:
    - GET
    - POST
    - OPTIONS
    allow_headers:
    - Content-Type
    - Accept
    - Origin
